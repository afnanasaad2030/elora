<!doctype html>

<!-- بطاقة المشاركة على واتساب/فيسبوك -->
<meta property="og:type" content="website">
<meta property="og:title" content="ELORA — إكسسوارات يدوية">
<meta property="og:description" content="تصفّح تشكيلة ELORA واطلب مباشرة عبر واتساب.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20260812150428">
</head>
<body>

<header class="hero">
  <button id="themeBtn" class="icon-btn theme-btn" title="تبديل الوضع" aria-label="تبديل الوضع الليلي">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
    </svg>
  </button>

  <div class="hero-inner">
    <div id="logoSlot" class="logo-slot" hidden></div>
    <h1 id="brandName">…</h1>
    <p id="tagline" class="tagline"></p>
    <div id="heroLinks" class="hero-links"></div>
  </div>
</header>

<nav id="filters" class="filters" aria-label="تصنيفات"></nav>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="emptyState" class="empty" hidden>
    لا توجد منتجات بعد.<br>
    <span>أضف صورك من لوحة التحكم، أو ضعها في مجلد <code>media</code> ثم شغّل <code>2-معاينة-المتجر.bat</code></span>
  </p>
  <div id="sentinel" class="sentinel"></div>
</main>

<footer class="footer">
  <p id="footerBrand"></p>
  <p class="count"><span id="totalCount">0</span> عنصر</p>
</footer>

<!-- زر واتساب عائم -->
<a id="waFab" class="wa-fab" hidden target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
    <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 004.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.06c-.25.69-1.44 1.32-1.98 1.36-.53.05-1.02.24-3.44-.72-2.9-1.14-4.74-4.1-4.88-4.29-.14-.19-1.17-1.55-1.17-2.96s.74-2.1 1-2.39c.25-.29.55-.36.73-.36.19 0 .37 0 .53.01.17.01.4-.06.63.48.24.58.8 1.99.87 2.13.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.3.37-.42.5-.14.14-.29.29-.12.57.16.29.73 1.2 1.56 1.94 1.07.95 1.98 1.25 2.26 1.39.28.14.45.12.61-.07.17-.19.71-.83.9-1.11.19-.29.38-.24.63-.14.25.09 1.61.76 1.88.9.28.14.46.21.53.33.07.12.07.69-.18 1.38z"/>
  </svg>
</a>

<!-- العارض -->
<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="عارض الصور">
  <button class="icon-btn lb-close" id="lbClose" aria-label="إغلاق">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="icon-btn lb-nav lb-prev" id="lbPrev" aria-label="السابق">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="icon-btn lb-nav lb-next" id="lbNext" aria-label="التالي">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <figure class="lb-stage" id="lbStage"></figure>

  <div class="lb-bar">
    <div class="lb-meta">
      <strong id="lbTitle"></strong>
      <span id="lbCat"></span>
    </div>
    <div class="lb-actions">
      <a id="lbWa" class="btn btn-wa" target="_blank" rel="noopener" hidden>اطلب عبر واتساب</a>
      <button id="lbShare" class="btn btn-ghost" type="button">مشاركة</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="assets/app.js?v=20260812150428"></script>
</body>
</html>
